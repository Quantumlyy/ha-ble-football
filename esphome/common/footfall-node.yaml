# Shared firmware for every footfall node. Do not flash this file directly:
# flash door-a.yaml, door-b.yaml, side-c.yaml or side-d.yaml, which include it.
#
# Each node listens passively for BLE advertisements and, every report interval,
# sends Home Assistant one "esphome.ble_footfall" event listing the devices it
# heard and how strongly. All counting happens in the ble_footfall integration.

substitutions:
  # Works for the ESP32-S3-DevKitC-1 and the M5Stack CoreS3 (also an ESP32-S3).
  # Other kits: esp32-c6-devkitc-1 (single core, see README), esp32dev (classic).
  board: esp32-s3-devkitc-1
  report_interval: 2s      # Keep in step with the integration's fix_window.
  rssi_floor: "-90"        # dBm. Anything weaker is ignored on the node.
  salt: !secret footfall_salt   # Must be identical on all nodes.

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  includes:
    - common/footfall.h

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If the node cannot join the WiFi above (wrong password, different site),
  # it opens its own network. Join it with a phone and a page appears where
  # the right WiFi can be entered. No reflashing needed.
  ap:
    ssid: ${friendly_name}
    password: !secret fallback_ap_password

captive_portal:

# The day number from Home Assistant's clock goes into the id hash, so every
# node rotates ids at the same moment (00:00 UTC).
time:
  - platform: homeassistant
    id: ha_time

sensor:
  # Placement aid: how many devices this node hears, averaged per minute.
  - platform: template
    id: devices_heard
    name: "Devices heard"
    icon: mdi:bluetooth
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 60s

  # Calibration aid: the strongest signal this node hears, averaged per minute.
  # With one phone held 1 m away and nothing else nearby, this is rssi_at_1m.
  - platform: template
    id: strongest_signal
    name: "Strongest signal"
    icon: mdi:signal
    entity_category: diagnostic
    device_class: signal_strength
    unit_of_measurement: dBm
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - throttle_average: 60s

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

esp32_ble_tracker:
  scan_parameters:
    active: false          # passive: listen only, never send scan requests
  on_ble_advertise:        # no mac_address filter = every advertisement
    - then:
        - lambda: footfall::observe(x.address_uint64(), x.get_rssi(), ${rssi_floor});

interval:
  - interval: ${report_interval}
    then:
      - lambda: |-
          id(devices_heard).publish_state(footfall::pending());
          if (footfall::pending() > 0) id(strongest_signal).publish_state(footfall::strongest());
      - if:
          condition:
            and:
              - api.connected:
              - lambda: return id(ha_time).now().is_valid() && footfall::pending() > 0;
          then:
            - homeassistant.event:
                event: esphome.ble_footfall
                data:
                  node: ${name}
                  devs: !lambda |-
                    return footfall::drain("${salt}", (uint32_t) (id(ha_time).now().timestamp / 86400));
          else:
            # Not connected or no valid clock yet: drop the interval, never queue it.
            - lambda: footfall::clear();
