<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>Node layout: four nodes in a diamond between two doors</title>
  <rect width="720" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#185fa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- room, 8 m x 4 m at 60 px per metre, with a gap for each door -->
  <rect x="120" y="60" width="480" height="240" fill="#f6f5f1"/>
  <path d="M120 150V60H600V150M600 210V300H120V210" fill="none" stroke="#5f5e5a" stroke-width="2"/>
  <line x1="120" y1="150" x2="120" y2="210" stroke="#1d9e75" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="600" y1="150" x2="600" y2="210" stroke="#1d9e75" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="112" y="140" text-anchor="end" fill="#0f6e56">Door A</text>
  <text x="608" y="140" fill="#0f6e56">Door B</text>

  <!-- counted path -->
  <path d="M30 180H690" fill="none" stroke="#185fa5" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="360" y="172" text-anchor="middle" fill="#185fa5">counted once: entered via A, left via B</text>

  <!-- outside passer -->
  <path d="M48 350V30" fill="none" stroke="#888780" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-grey)"/>
  <text x="58" y="345" fill="#5f5e5a">walks past outside:</text>
  <text x="58" y="362" fill="#5f5e5a">only door A hears it well, not counted</text>

  <!-- nodes -->
  <g stroke="#0f6e56" stroke-width="1.5" fill="#9fe1cb">
    <circle cx="120" cy="180" r="9"/>
    <circle cx="600" cy="180" r="9"/>
  </g>
  <g stroke="#534ab7" stroke-width="1.5" fill="#cecbf6">
    <circle cx="360" cy="60" r="9"/>
    <circle cx="360" cy="300" r="9"/>
  </g>
  <g fill="#2c2c2a">
    <text x="136" y="204">footfall-door-a</text>
    <text x="136" y="220" fill="#5f5e5a">x 0, y 2, door A</text>
    <text x="584" y="204" text-anchor="end">footfall-door-b</text>
    <text x="584" y="220" text-anchor="end" fill="#5f5e5a">x 8, y 2, door B</text>
    <text x="376" y="84">footfall-side-c</text>
    <text x="376" y="100" fill="#5f5e5a">x 4, y 4</text>
    <text x="376" y="284">footfall-side-d</text>
    <text x="376" y="268" fill="#5f5e5a">x 4, y 0</text>
  </g>

  <!-- scale -->
  <line x1="480" y1="330" x2="600" y2="330" stroke="#5f5e5a" stroke-width="1.5"/>
  <line x1="480" y1="325" x2="480" y2="335" stroke="#5f5e5a" stroke-width="1.5"/>
  <line x1="600" y1="325" x2="600" y2="335" stroke="#5f5e5a" stroke-width="1.5"/>
  <text x="540" y="350" text-anchor="middle" fill="#5f5e5a">2 m</text>
</svg>
